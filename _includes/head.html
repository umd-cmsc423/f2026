<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f1f1f">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.course.code }} · {{ site.data.course.term }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.course_description }} · {{ site.data.course.term }}{% endif %}">

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("cmsc423-theme");
        var preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    }());
  </script>
  <link rel="stylesheet" href="{{ '/_css/main.css' | prepend: site.baseurl }}">
  <link rel="icon" href="{{ '/_images/logo.png' | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <script src="{{ '/assets/js/theme.js' | prepend: site.baseurl }}" defer></script>
</head>
