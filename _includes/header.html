<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-brand" href="{{ site.baseurl }}/" aria-label="{{ site.data.course.code }} home">
      <span class="department-mark" aria-hidden="true">
        <img src="{{ '/_images/umd-cs-department-reversed.png' | prepend: site.baseurl }}" alt="" width="1270" height="225">
      </span>
      <span class="brand-copy"><strong>{{ site.data.course.code }}</strong><small>{{ site.course_name }}</small></span>
    </a>
    <div class="header-actions">
      <nav class="site-nav" aria-label="Primary navigation">
        {% include nav.html %}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <span class="theme-toggle-indicator" aria-hidden="true"></span>
        <span class="theme-toggle-label">Dark</span>
      </button>
    </div>
  </div>
</header>
